site_name: Aurastream Documentation
site_url: https://aurastream.unbiased-alpha.com/docs/
site_description: Unified financial data API — one endpoint, 28 data sources.

theme:
  name: material
  logo: assets/logo-icon.png
  favicon: assets/favicon.png
  palette:
    - scheme: slate
      primary: deep purple
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - scheme: default
      primary: deep purple
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - content.code.copy
    - content.code.annotate
    - search.suggest
    - search.highlight
  icon:
    repo: fontawesome/brands/github
  font:
    text: Inter
    code: JetBrains Mono

nav:
  - Home: index.md
  - Getting Started:
      - Quickstart: getting-started/quickstart.md
      - Authentication: getting-started/authentication.md
      - Credentials: getting-started/credentials.md
      - Plans & Limits: getting-started/plans-and-limits.md
      - Billing & Renewals: getting-started/billing.md
      - Claude & ChatGPT (MCP): getting-started/mcp.md
      - OpenBB: getting-started/openbb.md
  - API Reference:
      - Timeseries: api-reference/timeseries.md
      - Response Format: api-reference/response-format.md
      - Errors: api-reference/errors.md
  - Data Sources:
      - Overview: data-sources/overview.md
      - Crypto:
          - Binance: data-sources/binance.md
          - Bybit: data-sources/bybit.md
          - Kraken: data-sources/kraken.md
          - Deribit: data-sources/deribit.md
          - KuCoin: data-sources/kucoin.md
          - Nemeton: data-sources/nemeton.md
          - Hyperliquid: data-sources/hyperliquid.md
          - dYdX: data-sources/dydx.md
          - Derive (Lyra): data-sources/lyra.md
          - CoinAPI: data-sources/coinapi.md
          - CoinGecko: data-sources/coingecko.md
      - Equities, FX & Commodities:
          - Yahoo Finance: data-sources/yahoo.md
          - Alpaca: data-sources/alpaca.md
          - Polygon: data-sources/polygon.md
          - Oanda: data-sources/oanda.md
          - FirstRate Data: data-sources/firstrate.md
          - TradeStation: data-sources/tradestation.md
          - City Index: data-sources/cityindex.md
      - Macro & Energy:
          - FRED: data-sources/fred.md
          - EIA: data-sources/eia.md
          - US Treasury: data-sources/treasury.md
          - SDMX: data-sources/sdmx.md
          - World Bank: data-sources/worldbank.md
          - Nasdaq Data Link: data-sources/nasdaq.md
          - Trading Economics: data-sources/tradingeconomics.md
          - US Economic Calendar: data-sources/econcalendar.md
          - BEA National Accounts: data-sources/bea.md
          - Federal Reserve Texts: data-sources/fedtext.md
          - USAspending: data-sources/usaspending.md
      - Company Data & Positioning:
          - Finnhub: data-sources/finnhub.md
          - SEC EDGAR: data-sources/edgar.md
          - CFTC: data-sources/cftc.md
          - EU Net Short Positions: data-sources/netshort.md
      - Trade Flows:
          - UK Trade (HMRC): data-sources/hmrc.md
          - EU Trade (Eurostat): data-sources/comext.md
          - US Census (Trade, Retail): data-sources/uscensus.md
          - Hong Kong Trade: data-sources/hktrade.md
      - Alternative Data:
          - DefiLlama: data-sources/defillama.md
          - GDELT: data-sources/gdelt.md
          - Open-Meteo: data-sources/openmeteo.md
          - Visual Crossing: data-sources/visualcrossing.md
          - TSA Checkpoint Numbers: data-sources/tsa.md
          - WARN Layoff Notices: data-sources/warn.md
          - USDA WASDE: data-sources/wasde.md
          - NOAA Degree Days: data-sources/degreedays.md
      - Nemeton Signals: data-sources/signals.md
  - Examples:
      - Python: examples/python.md
      - Macro Analysis: examples/macro-analysis.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.snippets
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

plugins:
  - search

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/UnbiasedAlpha
